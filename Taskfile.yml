version: "3"

vars:
    GREETING: Hello, world!

tasks:
    dev:
        desc: Compile and run the project in dev profile
        cmds:
            - cargo run

    build:
        desc: Compile the project with optimization
        cmds:
            - cargo build --release

    build-licenses:
        desc: Build the licenses.json
        cmds:
            - echo "[build-licenses] Generating licenses.json..."
            - cargo install --locked --features cli cargo-about
            - cargo about generate --format json > crate_licenses.json
            - python3 license_build.py licenses.json crate_licenses.json assets/fonts/font_licenses.json notices.json license_priority.json

    appicon-macos:
        desc: Generate macOS app icon from PNG
        platforms: [darwin]
        cmds:
            - echo "[appicon-macos] Generating macOS app icon from PNG..."
            - rm -rf resources/AppIcon.iconset
            - rm -rf resources/AppIcon.icns
            - mkdir -p resources/AppIcon.iconset
            # Generate the required icon sizes for macOS from the source PNG
            - sips -z 16 16 assets/appicon/appicon.png --out resources/AppIcon.iconset/icon_16x16.png
            - sips -z 32 32 assets/appicon/appicon.png --out resources/AppIcon.iconset/icon_16x16@2x.png
            - sips -z 32 32 assets/appicon/appicon.png --out resources/AppIcon.iconset/icon_32x32.png
            - sips -z 64 64 assets/appicon/appicon.png --out resources/AppIcon.iconset/icon_32x32@2x.png
            - sips -z 128 128 assets/appicon/appicon.png --out resources/AppIcon.iconset/icon_128x128.png
            - sips -z 256 256 assets/appicon/appicon.png --out resources/AppIcon.iconset/icon_128x128@2x.png
            - sips -z 256 256 assets/appicon/appicon.png --out resources/AppIcon.iconset/icon_256x256.png
            - sips -z 512 512 assets/appicon/appicon.png --out resources/AppIcon.iconset/icon_256x256@2x.png
            - sips -z 512 512 assets/appicon/appicon.png --out resources/AppIcon.iconset/icon_512x512.png
            - sips -z 1024 1024 assets/appicon/appicon.png --out resources/AppIcon.iconset/icon_512x512@2x.png
            - iconutil -c icns resources/AppIcon.iconset
            - rm -rf resources/AppIcon.iconset

    bundle-macos:
        desc: Bundle the application on macOS platform
        platforms: [darwin]
        vars:
            TARGET: '{{ .target | default "aarch64-apple-darwin" }}'
            BINARY_NAME: kadent
            APP_NAME: Kadent
        deps:
            - task: build-licenses
            - task: appicon-macos
        cmds:
            - echo "[bundle-macos] Bundling the application for {{.TARGET}}..."
            # Recreate the dist directory for the target platform
            - rm -rf "./dist/{{.TARGET}}"
            - rm -rf ./resources/std
            - mkdir -p "./dist/{{.TARGET}}"
            - mkdir -p ./resources
            # Compile the project for the target platform
            - cargo build --release --target "{{.TARGET}}"
            # Create a directory structure, copy the binary and sign the binary
            - mkdir -p "./dist/{{.TARGET}}/{{.APP_NAME}}.app/Contents/MacOS"
            - mkdir -p "./dist/{{.TARGET}}/{{.APP_NAME}}.app/Contents/Resources"
            - cp "target/{{.TARGET}}/release/{{.BINARY_NAME}}" "./dist/{{.TARGET}}/{{.APP_NAME}}.app/Contents/MacOS"
            # Clone the latest KASL Standard Library from GitHub
            - git clone https://github.com/hatya-mouse/kasl-std ./resources/std
            # Copy the resources to the dist directory
            - cp ./info.plist "./dist/{{.TARGET}}/{{.APP_NAME}}.app/Contents"
            - cp -r ./resources/. "./dist/{{.TARGET}}/{{.APP_NAME}}.app/Contents/Resources"
            # Clean up the temporary KASL Standard Library clone
            - rm -rf ./resources/std

    # bundle-windows:
    #     desc: Bundle the application on Windows platform
    #     platforms: [windows]
    #     vars:
    #         TARGET: '{{ .target | default "x86_64-pc-windows-gnu" }}'
    #         BINARY_NAME: kadent
    #         APP_NAME: Kadent
    #     deps:
    #         - task: build-licenses
    #     cmds:
    #         # Recreate the dist directory for the target platform
