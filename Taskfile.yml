    #         - powershell -NoProfile -Command "Remove-Item -Recurse -Force './resources/std' -ErrorAction SilentlyContinue"
    #         - powershell -NoProfile -Command "New-Item -ItemType Directory -Force './dist/{{.TARGET}}/{{.APP_NAME}}/resources' | Out-Null"
    #         # Compile the project for the target platform
    #         - cargo build --release --target "{{.TARGET}}"
    #         - powershell -NoProfile -Command "Copy-Item 'target/{{.TARGET}}/release/{{.BINARY_NAME}}.exe' './dist/{{.TARGET}}/{{.APP_NAME}}/'"
    #         # Clone the latest KASL Standard Library from GitHub
    #         - git clone https://github.com/hatya-mouse/kasl-std ./resources/std
    #         # Copy the resources to the dist directory
