    #         # Clean up the temporary KASL Standard Library clone
    #         - powershell -NoProfile -Command "Remove-Item -Recurse -Force './resources/std'"

    bundle-windows:
        desc: Bundle the application for Windows platform on Linux
        platforms: [linux, darwin]
        vars:
            TARGET: '{{ .target | default "x86_64-pc-windows-gnu" }}'
            BINARY_NAME: kadent
            APP_NAME: Kadent
        deps:
            - task: build-licenses
        cmds:
            - echo "[bundle-windows] Bundling the application for {{.TARGET}}..."
            # Recreate the dist directory for the target platform
            - rm -rf "./dist/{{.TARGET}}"
            - rm -rf ./resources/std
            - mkdir -p "./dist/{{.TARGET}}"
            - mkdir -p ./resources
            # Clone the latest KASL Standard Library from GitHub
            - git clone https://github.com/hatya-mouse/kasl-std ./resources/std
            # Compile the project for the target platform
            - cargo build --release --target "{{.TARGET}}"
            # Create a directory structure and copy the binary and resources to the dist directory
            - mkdir -p "./dist/{{.TARGET}}/{{.APP_NAME}}/resources"
            - cp "target/{{.TARGET}}/release/{{.BINARY_NAME}}.exe" "./dist/{{.TARGET}}/{{.APP_NAME}}"
            - cp -r ./resources/. "./dist/{{.TARGET}}/{{.APP_NAME}}/resources"
            # Clean up the temporary KASL Standard Library clone
            - rm -rf ./resources/std

    bundle-linux:
        desc: Bundle the application on Linux platform
        platforms: [linux, darwin]
        vars:
            TARGET: '{{ .target | default "x86_64-unknown-linux-gnu" }}'
            BINARY_NAME: kadent
            APP_NAME: Kadent
        deps:
            - task: build-licenses
        cmds:
            - echo "[bundle-linux] Bundling the application for {{.TARGET}}..."
            # Recreate the dist directory for the target platform
            - rm -rf "./dist/{{.TARGET}}"
            - rm -rf ./resources/std
            - mkdir -p "./dist/{{.TARGET}}"
            - mkdir -p ./resources
            # Clone the latest KASL Standard Library from GitHub
            - git clone https://github.com/hatya-mouse/kasl-std ./resources/std
            # Compile the project for the target platform
            - cargo build --release --target "{{.TARGET}}"
            # Create a directory structure and copy the binary and resources to the dist directory
            - mkdir -p "./dist/{{.TARGET}}/{{.APP_NAME}}/resources"
            - cp "target/{{.TARGET}}/release/{{.BINARY_NAME}}" "./dist/{{.TARGET}}/{{.APP_NAME}}"
            - cp -r ./resources/. "./dist/{{.TARGET}}/{{.APP_NAME}}/resources"
            # Clean up the temporary KASL Standard Library clone
            - rm -rf ./resources/std

    installer-macos:
        desc: Create macOS installer disk image
        platforms: [darwin]
        vars:
            TARGET: '{{ .target | default "aarch64-apple-darwin" }}'
            APP_NAME: Kadent
        deps:
            - task: bundle-macos
              vars:
                  target: '{{.TARGET}}'
        cmds:
            - echo "[installer-macos] Building macOS installer disk image..."
            - rm -rf "./dist/{{.TARGET}}/dmg_src"
            - rm -f "./dist/{{.TARGET}}/{{.APP_NAME}}.dmg"
            - mkdir -p "./dist/{{.TARGET}}/dmg_src"
            - cp -r "./dist/{{.TARGET}}/{{.APP_NAME}}.app" "./dist/{{.TARGET}}/dmg_src"
            - ln -s /Applications "./dist/{{.TARGET}}/dmg_src/Applications"
            - hdiutil create
              -volname "{{.APP_NAME}}"
              -srcfolder "./dist/{{.TARGET}}/dmg_src"
              -ov
              -format UDZO
              "./dist/{{.TARGET}}/{{.APP_NAME}}.dmg"
            - rm -rf "./dist/{{.TARGET}}/dmg_src"

    compress-windows:
        desc: Create Windows binary ZIP file
        platforms: [linux, darwin]
        vars:
            TARGET: '{{ .target | default "x86_64-pc-windows-gnu" }}'
            APP_NAME: Kadent
        deps:
            - task: bundle-windows
              vars:
                  target: '{{.TARGET}}'
        cmds:
            - echo "[compress-windows] Compressing Windows bundle into zip..."
            - rm -f "./dist/{{.TARGET}}/{{.APP_NAME}}.zip"
            - |
              cd "./dist/{{.TARGET}}" &&
              zip -r "{{.APP_NAME}}.zip" "{{.APP_NAME}}"

    compress-linux:
        desc: Compress the Linux bundle into a tar.gz file
        platforms: [linux, darwin]
        vars:
            TARGET: '{{ .target | default "x86_64-unknown-linux-gnu" }}'
            APP_NAME: Kadent
        deps:
            - task: bundle-linux
              vars:
                  target: '{{.TARGET}}'
        cmds:
            - echo "[compress-linux] Compressing Linux bundle into tar.gz..."
            - rm -f "./dist/{{.TARGET}}/{{.APP_NAME}}.tar.gz"
            - |
              cd "./dist/{{.TARGET}}" &&
              tar -zcvf "{{.APP_NAME}}.tar.gz" "{{.APP_NAME}}"
