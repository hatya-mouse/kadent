name: Release Kadent

on:
    push:
        tags:
            - "v*"

jobs:
    build-macos-arm:
        name: Build macOS ARM64
        runs-on: macos-latest
        permissions:
            contents: read

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: aarch64-apple-darwin

            - name: Install Task
              uses: arduino/setup-task@v3

            - name: Install cargo-about
              run: cargo install --locked --features cli cargo-about

            - name: Build DMG
              run: task installer-macos target=aarch64-apple-darwin

            - name: Upload macOS artifact
              uses: actions/upload-artifact@v7
              with:
                  name: Kadent-macOS-arm64
                  path: dist/aarch64-apple-darwin/aarch64-apple-darwin.dmg

    build-windows-x86:
        name: Build Windows x86_64
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: x86_64-pc-windows-gnu

            - name: Install MinGW
              run: sudo apt-get update && sudo apt-get install -y mingw-w64

            - name: Install Task
              uses: arduino/setup-task@v3

            - name: Install cargo-about
              run: cargo install --locked --features cli cargo-about

            - name: Build ZIP
              run: task compress-windows target=x86_64-pc-windows-gnu

            - name: Upload Windows artifact
              uses: actions/upload-artifact@v7
              with:
                  name: Kadent-Windows-x86_64
                  path: dist/x86_64-pc-windows-gnu/x86_64-pc-windows-gnu.zip

    build-linux:
        name: Build Linux x86_64
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install Linux dependencies
              run: sudo apt-get update && sudo apt-get install -y libasound2-dev

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: x86_64-unknown-linux-gnu

            - name: Install Task
              uses: arduino/setup-task@v3

            - name: Install cargo-about
              run: cargo install --locked --features cli cargo-about

            - name: Build tar.gz
              run: task compress-linux target=x86_64-unknown-linux-gnu

            - name: Upload Linux artifact
              uses: actions/upload-artifact@v7
              with:
                  name: Kadent-Linux-x86_64
                  path: dist/x86_64-unknown-linux-gnu/x86_64-unknown-linux-gnu.tar.gz

    release:
        name: Create GitHub Release
        runs-on: ubuntu-latest
        needs:
            - build-macos-arm
            - build-windows-x86
            - build-linux
        permissions:
            contents: write

        steps:
            - name: Download macOS artifact
              uses: actions/download-artifact@v7
              with:
                  name: Kadent-macOS-arm64
                  path: release

            - name: Download Windows artifact
              uses: actions/download-artifact@v7
              with:
                  name: Kadent-Windows-x86_64
                  path: release

            - name: Download Linux artifact
              uses: actions/download-artifact@v7
              with:
                  name: Kadent-Linux-x86_64
                  path: release

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v3
              with:
                  files: |
                      release/aarch64-apple-darwin.dmg
                      release/x86_64-pc-windows-gnu.zip
                      release/x86_64-unknown-linux-gnu.tar.gz
