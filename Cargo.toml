[package]
name = "kadent"
version = "0.1.0"
edition = "2024"

[dependencies]
dirs = "6.0.0"
eframe = "0.34.3"
egui_extras = { version = "0.34.3", features = ["all_loaders", "syntect"] }
hound = "3.5.1"
kasl = { version = "0.2.35", features = ["cranelift"] }
kadent_engine = { git = "https://github.com/hatya-mouse/kadent_engine" }
midir = "0.11.0"
rfd = "0.17.2"
ringbuf = "0.5.0"
serde = "1.0.228"
serde_json = "1.0.150"
cpal = "0.18.1"
syntect = "5.3.0"
postcard = { version = "1.1.3", features = ["alloc"] }

[build-dependencies]
syntect = "5.3.0"

[package.metadata.bundle]
name = "Kadent"
identifier = "com.hatya.kadent"
version = "0.1.0"
category = "Music"
copyright = "© 2026 Shuntaro Kasatani"
osx_info_plist_exts = ["info_ext.plist"]
